<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supra — Enviado</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="success-wrapper">
    <div class="success-content">
      <div class="brand brand-center" style="margin-bottom: var(--sp-2xl);">
        <div class="brand-logo" id="brandLogo" style="width:48px;height:48px;font-size:1.2rem;">S</div>
        <span class="brand-name">Supra</span>
      </div>

      <div class="success-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1 class="success-title" id="successTitle"></h1>
      <p class="success-text" id="successMessage"></p>
      <p class="success-text" id="successThank" style="margin-top: var(--sp-md); font-weight: 500; color: var(--text);"></p>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var lang = params.get('lang') || 'es';
      document.documentElement.lang = lang === 'pt' ? 'pt' : lang === 'en' ? 'en' : 'es';
      document.getElementById('successTitle').textContent = t('successTitle', lang);
      document.getElementById('successMessage').textContent = t('successMessage', lang);
      document.getElementById('successThank').textContent = t('successThank', lang);
    })();
  </script>
</body>
</html>
