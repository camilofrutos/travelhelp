<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supra — Acceso Admin</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand brand-center">
        <div class="brand-logo" id="brandLogo">S</div>
        <span class="brand-name">Supra</span>
      </div>

      <h1 class="auth-title">Acceso Administrativo</h1>
      <p class="auth-subtitle">Ingresá tus credenciales para continuar</p>

      <div class="alert alert-error" id="loginError" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            placeholder="Tu usuario"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="Tu contraseña"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <span class="spinner"></span>
          <span class="btn-text">Ingresar</span>
        </button>
      </form>
    </div>

    <footer class="site-footer" style="position:fixed;bottom:0;left:0;right:0;border-top:none;background:transparent;">
      <div class="footer-text">© 2026 Supra International. All rights reserved.</div>
    </footer>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
