<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supra — Formulario</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="form-public-wrapper">

    <!-- Progress Bar -->
    <div class="progress-bar-wrapper" id="progressWrapper" style="display:none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Header -->
    <header class="form-public-header">
      <div class="brand">
        <div class="brand-logo" id="brandLogo">S</div>
        <span class="brand-name">Supra</span>
      </div>
      <span class="step-counter" id="stepCounter"></span>
    </header>

    <!-- Body -->
    <main class="form-public-body">
      <div class="form-public-container">

        <!-- Loading state -->
        <div id="loadingState" class="status-message">
          <p style="color:var(--text-soft);">Cargando...</p>
        </div>

        <!-- Status error states -->
        <div id="statusError" class="status-message hidden">
          <div class="status-message-icon error" id="statusIcon">&#10005;</div>
          <h2 id="statusTitle"></h2>
          <p id="statusMsg"></p>
        </div>

        <!-- Login -->
        <div id="loginSection" class="form-login-wrapper hidden">
          <div class="brand brand-center" style="margin-bottom: var(--sp-xl);">
            <div class="brand-logo" style="width:56px;height:56px;font-size:1.4rem;">S</div>
          </div>
          <h1 class="auth-title" id="formLoginTitle"></h1>
          <p class="auth-subtitle" id="formLoginSubtitle"></p>

          <div class="alert alert-error" id="formLoginError" role="alert"></div>

          <form id="formLoginForm" novalidate>
            <div class="form-group" style="text-align:left;">
              <label class="form-label" for="fl-username" id="flUsernameLabel"></label>
              <input class="form-input" type="text" id="fl-username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group" style="text-align:left;">
              <label class="form-label" for="fl-password" id="flPasswordLabel"></label>
              <input class="form-input" type="password" id="fl-password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="formLoginBtn">
              <span class="spinner"></span>
              <span class="btn-text" id="formLoginBtnText"></span>
            </button>
          </form>
        </div>

        <!-- Dynamic Form Steps -->
        <div id="formSection" class="hidden">
          <form id="mainForm" novalidate>
            <div id="stepsContainer"></div>
          </form>
          <div class="alert alert-error" id="submitError" role="alert" style="margin-top: var(--sp-lg);"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/form-config.js"></script>
  <script src="/js/form.js"></script>
</body>
</html>
