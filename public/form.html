<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supra — Formulario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="form-public-wrapper">

    <!-- Progress Bar -->
    <div class="progress-bar-wrapper" id="progressWrapper">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Header -->
    <header class="form-public-header">
      <div class="brand">
        <div class="brand-logo" id="brandLogo">S</div>
        <span class="brand-name">Supra</span>
      </div>
      <span class="step-counter" id="stepCounter"></span>
    </header>

    <!-- Body -->
    <main class="form-public-body">
      <div class="form-public-container">

        <!-- Dynamic Form Steps -->
        <div id="formSection">
          <form id="mainForm" novalidate>
            <div id="stepsContainer"></div>
          </form>
        </div>

      </div>
    </main>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/form-config.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
